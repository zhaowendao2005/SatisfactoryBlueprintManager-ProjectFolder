<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝图管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#6366F1',
                        success: '#10B981',
                        danger: '#EF4444',
                        neutral: '#64748B',
                        light: '#F1F5F9',
                        dark: '#1E293B'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .blueprint-card {
                @apply bg-white rounded-lg shadow-md p-4 transition-all duration-300 hover:shadow-lg;
            }
            .tag {
                @apply px-2 py-1 rounded-full text-xs font-medium cursor-pointer transition-all duration-200;
            }
            .tag-active {
                @apply bg-primary text-white;
            }
            .tag-inactive {
                @apply bg-light text-dark hover:bg-primary/10;
            }
            .logic-btn {
                @apply px-3 py-1 rounded-md text-sm font-medium transition-all duration-200;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <header class="mb-8">
            <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-dark mb-2">蓝图管理中心</h1>
            <p class="text-neutral">管理、筛选和标记您的蓝图资源</p>
        </header>

        <!-- 标签筛选区域 -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-lg font-semibold mb-2">标签筛选</h2>
                    <p class="text-sm text-neutral">点击标签进行筛选，可组合逻辑条件</p>
                </div>
                
                <!-- 逻辑操作选择 -->
                <div class="flex items-center gap-3">
                    <span class="text-sm text-neutral">多标签逻辑:</span>
                    <button id="logic-and" class="logic-btn bg-primary text-white">
                        <i class="fa fa-and mr-1"></i> 与
                    </button>
                    <button id="logic-or" class="logic-btn bg-light text-dark">
                        <i class="fa fa-or mr-1"></i> 或
                    </button>
                </div>
            </div>

            <!-- 标签显示区域 -->
            <div id="tag-container" class="flex flex-wrap gap-2 mb-4">
                <!-- 标签会通过JS动态生成 -->
            </div>

            <!-- 活跃筛选条件显示 -->
            <div id="active-filters" class="flex flex-wrap gap-2 mt-4 min-h-[40px]">
                <span class="text-sm text-neutral italic" id="no-filters-message">未选择筛选条件</span>
            </div>
        </div>

        <!-- 批量操作工具栏 -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div class="flex items-center gap-3">
                <button id="batch-toggle" class="px-4 py-2 bg-primary text-white rounded-md flex items-center gap-2 hover:bg-primary/90 transition-colors">
                    <i class="fa fa-check-square-o"></i>
                    <span>批量操作</span>
                </button>
                
                <div id="batch-actions" class="hidden items-center gap-2">
                    <span class="text-sm text-neutral">添加标签:</span>
                    <select id="tag-select" class="border rounded-md px-2 py-1 text-sm">
                        <!-- 标签选项会通过JS动态生成 -->
                    </select>
                    <button id="apply-tags" class="px-3 py-1 bg-success text-white rounded-md text-sm hover:bg-success/90 transition-colors">
                        <i class="fa fa-tag mr-1"></i>应用
                    </button>
                    <button id="remove-tags" class="px-3 py-1 bg-danger text-white rounded-md text-sm hover:bg-danger/90 transition-colors">
                        <i class="fa fa-remove mr-1"></i>移除
                    </button>
                </div>
            </div>
            
            <div>
                <span class="text-neutral mr-2" id="blueprint-count">显示 0 个蓝图</span>
            </div>
        </div>

        <!-- 蓝图网格 -->
        <div id="blueprint-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- 蓝图卡片会通过JS动态生成 -->
        </div>
    </div>

    <script>
        // 示例数据 - 标签
        const allTags = [
            { id: 1, name: '建筑' },
            { id: 2, name: '机械' },
            { id: 3, name: '电气' },
            { id: 4, name: '设计中' },
            { id: 5, name: '已审核' },
            { id: 6, name: '待修改' },
            { id: 7, name: '重要' },
            { id: 8, name: '常规' }
        ];

        // 示例数据 - 蓝图
        const blueprints = [
            {
                id: 1,
                title: '办公楼设计蓝图',
                description: '总部办公楼的结构设计方案',
                tags: [1, 4, 7],
                updated: '2023-10-15'
            },
            {
                id: 2,
                title: '生产流水线布局',
                description: '第三车间生产线优化方案',
                tags: [2, 5],
                updated: '2023-10-12'
            },
            {
                id: 3,
                title: '电力系统改造',
                description: '厂区电力系统升级蓝图',
                tags: [3, 6, 7],
                updated: '2023-10-18'
            },
            {
                id: 4,
                title: '仓库扩建计划',
                description: '物流仓库扩建结构设计',
                tags: [1, 4],
                updated: '2023-10-05'
            },
            {
                id: 5,
                title: '自动化控制系统',
                description: '生产线自动化控制设计',
                tags: [2, 3, 5],
                updated: '2023-10-20'
            },
            {
                id: 6,
                title: '员工宿舍设计',
                description: '新建员工宿舍的建筑设计',
                tags: [1, 6, 8],
                updated: '2023-10-08'
            },
            {
                id: 7,
                title: '设备维护手册',
                description: '主要生产设备的维护蓝图',
                tags: [2, 5, 8],
                updated: '2023-10-14'
            },
            {
                id: 8,
                title: '消防系统设计',
                description: '全厂区消防系统改造方案',
                tags: [1, 3, 7],
                updated: '2023-10-19'
            }
        ];

        // 全局状态
        let state = {
            activeTags: new Set(),
            logicMode: 'and', // 'and' 或 'or'
            batchMode: false,
            selectedBlueprints: new Set()
        };

        // DOM 元素
        const elements = {
            tagContainer: document.getElementById('tag-container'),
            activeFilters: document.getElementById('active-filters'),
            noFiltersMessage: document.getElementById('no-filters-message'),
            blueprintGrid: document.getElementById('blueprint-grid'),
            blueprintCount: document.getElementById('blueprint-count'),
            batchToggle: document.getElementById('batch-toggle'),
            batchActions: document.getElementById('batch-actions'),
            tagSelect: document.getElementById('tag-select'),
            applyTags: document.getElementById('apply-tags'),
            removeTags: document.getElementById('remove-tags'),
            logicAnd: document.getElementById('logic-and'),
            logicOr: document.getElementById('logic-or')
        };

        // 初始化
        function init() {
            renderTags();
            renderTagSelect();
            renderBlueprints(blueprints);
            setupEventListeners();
        }

        // 渲染标签
        function renderTags() {
            elements.tagContainer.innerHTML = '';
            
            allTags.forEach(tag => {
                const tagEl = document.createElement('span');
                tagEl.className = `tag ${state.activeTags.has(tag.id) ? 'tag-active' : 'tag-inactive'}`;
                tagEl.textContent = tag.name;
                tagEl.dataset.tagId = tag.id;
                
                tagEl.addEventListener('click', () => toggleTag(tag.id));
                elements.tagContainer.appendChild(tagEl);
            });
        }

        // 渲染标签选择下拉框
        function renderTagSelect() {
            elements.tagSelect.innerHTML = '';
            
            allTags.forEach(tag => {
                const option = document.createElement('option');
                option.value = tag.id;
                option.textContent = tag.name;
                elements.tagSelect.appendChild(option);
            });
        }

        // 切换标签状态
        function toggleTag(tagId) {
            if (state.activeTags.has(tagId)) {
                state.activeTags.delete(tagId);
            } else {
                state.activeTags.add(tagId);
            }
            
            renderTags();
            renderActiveFilters();
            filterAndRenderBlueprints();
        }

        // 渲染活跃的筛选条件
        function renderActiveFilters() {
            elements.activeFilters.innerHTML = '';
            
            if (state.activeTags.size === 0) {
                elements.activeFilters.innerHTML = '<span class="text-sm text-neutral italic">未选择筛选条件</span>';
                return;
            }
            
            // 添加活跃标签
            state.activeTags.forEach(tagId => {
                const tag = allTags.find(t => t.id === tagId);
                if (tag) {
                    const filterEl = document.createElement('span');
                    filterEl.className = 'tag tag-active flex items-center gap-1';
                    filterEl.innerHTML = `${tag.name} <i class="fa fa-times-circle text-xs"></i>`;
                    filterEl.dataset.tagId = tagId;
                    
                    filterEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleTag(tagId);
                    });
                    
                    elements.activeFilters.appendChild(filterEl);
                }
            });
            
            // 添加清除按钮
            const clearBtn = document.createElement('button');
            clearBtn.className = 'tag tag-inactive';
            clearBtn.innerHTML = '<i class="fa fa-trash-o mr-1"></i> 清除全部';
            clearBtn.addEventListener('click', clearAllFilters);
            elements.activeFilters.appendChild(clearBtn);
        }

        // 清除所有筛选条件
        function clearAllFilters() {
            state.activeTags.clear();
            renderTags();
            renderActiveFilters();
            filterAndRenderBlueprints();
        }

        // 切换逻辑模式 (与/或)
        function setLogicMode(mode) {
            state.logicMode = mode;
            
            if (mode === 'and') {
                elements.logicAnd.className = 'logic-btn bg-primary text-white';
                elements.logicOr.className = 'logic-btn bg-light text-dark';
            } else {
                elements.logicAnd.className = 'logic-btn bg-light text-dark';
                elements.logicOr.className = 'logic-btn bg-primary text-white';
            }
            
            filterAndRenderBlueprints();
        }

        // 筛选并渲染蓝图
        function filterAndRenderBlueprints() {
            let filtered = blueprints;
            
            if (state.activeTags.size > 0) {
                filtered = blueprints.filter(blueprint => {
                    if (state.logicMode === 'and') {
                        // 与逻辑: 蓝图必须包含所有选中的标签
                        return Array.from(state.activeTags).every(tagId => 
                            blueprint.tags.includes(tagId)
                        );
                    } else {
                        // 或逻辑: 蓝图只需包含至少一个选中的标签
                        return Array.from(state.activeTags).some(tagId => 
                            blueprint.tags.includes(tagId)
                        );
                    }
                });
            }
            
            renderBlueprints(filtered);
        }

        // 渲染蓝图网格
        function renderBlueprints(blueprintsToRender) {
            elements.blueprintGrid.innerHTML = '';
            elements.blueprintCount.textContent = `显示 ${blueprintsToRender.length} 个蓝图`;
            
            if (blueprintsToRender.length === 0) {
                elements.blueprintGrid.innerHTML = `
                    <div class="col-span-full py-12 text-center">
                        <i class="fa fa-search fa-3x text-neutral/30 mb-4"></i>
                        <p class="text-neutral">没有找到符合条件的蓝图</p>
                    </div>
                `;
                return;
            }
            
            blueprintsToRender.forEach(blueprint => {
                const blueprintEl = document.createElement('div');
                blueprintEl.className = 'blueprint-card';
                blueprintEl.dataset.blueprintId = blueprint.id;
                
                // 获取蓝图的标签信息
                const blueprintTags = blueprint.tags.map(tagId => 
                    allTags.find(t => t.id === tagId)
                ).filter(Boolean);
                
                // 批量选择框
                const checkboxHtml = state.batchMode 
                    ? `<input type="checkbox" class="blueprint-select absolute top-3 left-3" data-id="${blueprint.id}" ${state.selectedBlueprints.has(blueprint.id) ? 'checked' : ''}>`
                    : '';
                
                blueprintEl.innerHTML = `
                    <div class="relative">
                        ${checkboxHtml}
                        <h3 class="font-semibold text-lg mb-2 ${state.batchMode ? 'pl-6' : ''}">${blueprint.title}</h3>
                        <p class="text-neutral text-sm mb-4">${blueprint.description}</p>
                        
                        <div class="flex flex-wrap gap-1 mb-3">
                            ${blueprintTags.map(tag => `
                                <span class="tag tag-inactive">${tag.name}</span>
                            `).join('')}
                        </div>
                        
                        <div class="text-xs text-neutral mt-2">
                            <i class="fa fa-clock-o mr-1"></i> 最后更新: ${blueprint.updated}
                        </div>
                    </div>
                `;
                
                elements.blueprintGrid.appendChild(blueprintEl);
                
                // 添加选择事件
                if (state.batchMode) {
                    const checkbox = blueprintEl.querySelector('.blueprint-select');
                    checkbox.addEventListener('change', (e) => {
                        toggleBlueprintSelection(Number(e.target.dataset.id));
                    });
                }
            });
        }

        // 切换批量操作模式
        function toggleBatchMode() {
            state.batchMode = !state.batchMode;
            
            if (state.batchMode) {
                elements.batchToggle.innerHTML = '<i class="fa fa-times"></i><span>取消批量</span>';
                elements.batchToggle.classList.remove('bg-primary');
                elements.batchToggle.classList.add('bg-neutral');
                elements.batchActions.classList.remove('hidden');
                elements.batchActions.classList.add('flex');
                state.selectedBlueprints.clear();
            } else {
                elements.batchToggle.innerHTML = '<i class="fa fa-check-square-o"></i><span>批量操作</span>';
                elements.batchToggle.classList.remove('bg-neutral');
                elements.batchToggle.classList.add('bg-primary');
                elements.batchActions.classList.add('hidden');
                elements.batchActions.classList.remove('flex');
            }
            
            filterAndRenderBlueprints();
        }

        // 切换蓝图选择状态
        function toggleBlueprintSelection(blueprintId) {
            if (state.selectedBlueprints.has(blueprintId)) {
                state.selectedBlueprints.delete(blueprintId);
            } else {
                state.selectedBlueprints.add(blueprintId);
            }
        }

        // 批量添加标签
        function batchAddTags() {
            const tagId = Number(elements.tagSelect.value);
            if (!tagId) return;
            
            blueprints.forEach(blueprint => {
                if (state.selectedBlueprints.has(blueprint.id) && !blueprint.tags.includes(tagId)) {
                    blueprint.tags.push(tagId);
                }
            });
            
            filterAndRenderBlueprints();
        }

        // 批量移除标签
        function batchRemoveTags() {
            const tagId = Number(elements.tagSelect.value);
            if (!tagId) return;
            
            blueprints.forEach(blueprint => {
                if (state.selectedBlueprints.has(blueprint.id)) {
                    blueprint.tags = blueprint.tags.filter(id => id !== tagId);
                }
            });
            
            filterAndRenderBlueprints();
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 逻辑模式切换
            elements.logicAnd.addEventListener('click', () => setLogicMode('and'));
            elements.logicOr.addEventListener('click', () => setLogicMode('or'));
            
            // 批量操作切换
            elements.batchToggle.addEventListener('click', toggleBatchMode);
            
            // 批量标签操作
            elements.applyTags.addEventListener('click', batchAddTags);
            elements.removeTags.addEventListener('click', batchRemoveTags);
        }

        // 启动应用
        init();
    </script>
</body>
</html>
