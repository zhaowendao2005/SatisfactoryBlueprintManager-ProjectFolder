# electron-builder 配置文件
# 用于构建 NSIS 安装包
# 配置与 quasar.config.ts 中的 builder 配置保持一致

appId: satisfactoryblueprintmanager
productName: SatisfactoryBlueprintManager

# 输出目录和应用目录
directories:
  output: dist/electron/Installer
  app: dist/electron/UnPackaged

# Windows 平台配置
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icons/favicon-256x256.ico

# NSIS 安装程序配置
nsis:
  # 安装程序文件名
  artifactName: ${productName}-Setup-${version}.${ext}
  # 一键安装模式（不需要用户选择安装目录）
  oneClick: false
  # 允许用户选择安装目录
  allowToChangeInstallationDirectory: true
  # 创建桌面快捷方式
  createDesktopShortcut: true
  # 创建开始菜单项
  createStartMenuShortcut: true
  # 安装完成后运行应用
  runAfterFinish: true
  # 卸载程序名称
  uninstallDisplayName: ${productName}
  # 安装程序语言
  language: '2052' # 简体中文
  # 安装向导图标
  installerIcon: public/icons/favicon-256x256.ico
  # 卸载向导图标
  uninstallerIcon: public/icons/favicon-256x256.ico
  # 安装程序头部图标
  installerHeaderIcon: public/icons/favicon-256x256.ico

# 额外资源：Python 自动化服务 exe
extraResources:
  - from: public/automation-service
    to: automation-service

